name: Build MikuTube Patches

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MikuTube Patches (Android)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid -x test -x check \
            -Pgpr.user="${GITHUB_ACTOR}" \
            -Pgpr.key="${GITHUB_TOKEN}"
          find patches/build -maxdepth 3 -name "*.mpp" -ls
          for f in patches/build/libs/*.mpp; do
            case "$f" in *-sources.mpp|*-javadoc.mpp) continue;; esac
            echo "=== Checking DEX inside $f ==="
            unzip -l "$f" | grep -E "classes\.dex|extensions" | head -n 10
          done

      - name: Upload Patches Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MikuTube-Patches
          path: |
            patches/build/libs/*.mpp
            !patches/build/libs/*-sources.mpp
            !patches/build/libs/*-javadoc.mpp
