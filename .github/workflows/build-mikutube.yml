name: Build MikuTube Patches

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MikuTube Patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:build -x test -x check \
            -Pgpr.user="${GITHUB_ACTOR}" \
            -Pgpr.key="${GITHUB_TOKEN}"
          ls -lh patches/build/libs/

      - name: Upload Patches Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MikuTube-Patches
          path: patches/build/libs/*.mpp
